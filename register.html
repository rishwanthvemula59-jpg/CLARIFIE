<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal — Register</title>

  <style>
    @font-face {
      font-family: 'FreeSans';
      src: local('FreeSans'), local('Helvetica Neue'), local('Arial'), sans-serif;
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'FreeSans';
      src: local('FreeSans Bold'), local('Helvetica Neue Bold'), local('Arial Bold'), sans-serif;
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: 'Eloquia';
      src: local('Readex Pro'), local('Space Grotesk'), local('Inter'), sans-serif;
      font-display: block;
    }

    :root {
      --W:1464; --H:949; --photoW:836; --paneW:628; --cardW:613; --cardH:922;
      --badge-fs:13.60px; --badge-fw:400; --badge-ls:-0.163px; --badge-gap:10px; --badge-dy:0px; --badge-ws:0px;
      --badge-left:34px; --badge-top:684px;
      --hl-lh:1; --hl-wght:578;
      --hl1-fs:69.14px; --hl1-ls:-1.936px; --hl1-ws:0px; --hl1-left:33.00px; --hl1-top:750.02px;
      --hl2-fs:68.95px; --hl2-ls:-1.931px; --hl2-left:32.00px; --hl2-top:831.01px;
      --h1-top:235.00px; --h1-fs:42.55px; --h1-ls:-2.553px; --h1-ws:1.300px; --h1-wght:584;
      --sub-top:290.00px; --sub-fs:20.41px; --sub-ls:-0.245px; --sub-ws:-2.000px; --sub-fw:400; --sub-fwb:700;
      --fieldpad:19px;
      --eph-fs:15.68px; --eph-ls:-0.188px; --eph-left:17.0px; --eph-fw:400; --eph-ws:0px;
      --pph-fs:17.29px; --pph-ls:-0.698px; --pph-left:18px; --pph-fw:400;
      --login-fs:16.38px; --login-fw:400; --login-ls:0.200px; --login-gap:10px; --login-dy:0.00px; --login-padl:-12.00px;
      --arrow-w:13.2px;
      --div-top:477px; --or-fs:11.5px; --or-fw:700; --or-ls:0.8px; --or-dy:2.00px; --or-dx:0.00px;
      --or-line-l:205px; --or-line-r:204px;
      --g-gap:17px; --g-icon:18.5px;
      --gt-fs:18.10px; --gt-fw:400; --gt-ls:-0.217px; --gt-ws:-1.000px; --gt-dy:1.00px;
      --bt-top:615.00px; --bt-fs:16.37px; --bt-fw:400; --bt-ls:-0.196px; --bt-ws:-2.060px; --bt-fwb:700; --bt-uo:3px;
      --card-shadow:1px 10px 14px rgba(10,14,20,0.14), 0 1px 3px rgba(10,14,20,0.05);
      --cs:1;
      --ink:#000;          --h1-color:#2c3343;   --sub-grey:#797979;
      --badge-bg:#2f2a27;  --ph:#606060;         --or:#5a5a5b;
      --gtext:#232424;     --bottom:#0a0a0a;
      --btn1:#283139;      --btn2:#293340;
      --inputFill:#fafafa; --inputBorder:#acacae; --pwFill:#f9f9f9;
      --gBorder:#c8c8ca;   --divider:#b1b1b2;     --page:#fefefe;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--page); }
    body {
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
      color: var(--ink);
    }

    .stage { position: fixed; inset: 0; overflow: hidden; }
    .photo { position: absolute; left: 0; top: 0; height: 100%; width: 57.1038%; overflow: hidden; }
    .photo-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      object-position: 100% 50%; display: block; -webkit-user-drag: none;
    }
    .photo-img--tall { display: block; }
    .photo-img--wide { display: none; }
    .scrim { display: none; }

    .hero {
      position: absolute; left: 0; bottom: 0; width: 836px; height: 949px;
      transform-origin: left bottom; pointer-events: none;
    }
    .hero > * { pointer-events: auto; }

    .badge {
      position: absolute; left: var(--badge-left); top: var(--badge-top);
      display: inline-flex; align-items: center; gap: var(--badge-gap);
      height: 37px; padding: 0 16px 0 19px; border-radius: 999px;
      background: var(--badge-bg); backdrop-filter: blur(7px) saturate(120%);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
      color: #fff; font-size: var(--badge-fs); font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls); white-space: nowrap;
    }

    .hl-wrap { position: absolute; inset: 0; pointer-events: none; }
    .hl {
      position: absolute; font-family: 'Eloquia', 'Readex Pro', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght); line-height: var(--hl-lh);
      color: var(--ink); white-space: nowrap;
    }
    #hl1 { left: var(--hl1-left); top: var(--hl1-top); font-size: var(--hl1-fs); letter-spacing: var(--hl1-ls); }
    #hl2 { left: var(--hl2-left); top: var(--hl2-top); font-size: var(--hl2-fs); letter-spacing: var(--hl2-ls); }

    .pane { position: absolute; left: 57.1038%; right: 0; top: 0; bottom: 0; }
    .card {
      position: absolute; left: 1px; top: 14px; width: 613px; height: 922px;
      border-radius: 26px; overflow: hidden; background: rgba(254,254,254,.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0,0,0,.036); box-shadow: var(--card-shadow);
    }
    .card-in { position: absolute; inset: 0; width: 613px; height: 922px; transform-origin: left top; }

    .col { position: absolute; left: 62px; width: 488px; }
    .col.center { text-align: center; }
    #h1 {
      top: var(--h1-top); font-family: 'Eloquia', 'Readex Pro', sans-serif;
      font-variation-settings: 'wght' var(--h1-wght); font-size: var(--h1-fs);
      letter-spacing: var(--h1-ls); word-spacing: var(--h1-ws); color: var(--h1-color);
    }
    #sub {
      top: var(--sub-top); font-size: var(--sub-fs); letter-spacing: var(--sub-ls);
      word-spacing: var(--sub-ws); font-weight: var(--sub-fw); color: var(--sub-grey);
    }
    #sub b { font-weight: var(--sub-fwb); color: var(--ink); }

    .field {
      position: absolute; left: 62px; width: 489px; display: flex; align-items: center; border-radius: 12px;
    }
    .field input {
      width: 100%; height: 100%; border: none; background: transparent;
      padding: 0 var(--fieldpad); font-family: inherit; color: var(--ink); outline: none;
    }
    #email { top: 365px; height: 61px; background: var(--inputFill); border: 1.5px solid var(--inputBorder); }
    #email input { font-size: var(--eph-fs); letter-spacing: var(--eph-ls); }
    #email input::placeholder { color: var(--ph); }

    #pw { top: 440px; height: 59px; background: var(--pwFill); border: none; }
    #pw input { font-size: var(--pph-fs); letter-spacing: var(--pph-ls); }
    #pw input::placeholder { color: var(--ph); }

    #loginBtn {
      position: absolute; left: 62px; top: 525px; width: 489px; height: 65.5px;
      border-radius: 999px; border: none; cursor: pointer;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #fff; display: flex; align-items: center; justify-content: center;
      gap: var(--login-gap); padding-left: var(--login-padl); padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18,26,34,.16), 0 2px 5px rgba(18,26,34,.10);
      font-size: var(--login-fs); font-weight: var(--login-fw); letter-spacing: var(--login-ls);
      transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, filter .18s ease;
    }
    #loginBtn:hover { filter: brightness(1.12); }
    #loginBtn:active { transform: translateY(1px); }

    .divider {
      position: absolute; left: 63px; top: var(--div-top); width: 487px;
      display: flex; align-items: center; justify-content: center;
    }
    .divider i { height: 1.5px; background: var(--divider); }
    .divider i:first-child { flex: 0 0 205px; }
    .divider i:last-child { flex: 0 0 204px; }
    .divider b {
      flex: 1 1 auto; text-align: center; font-size: var(--or-fs);
      font-weight: var(--or-fw); letter-spacing: var(--or-ls); color: var(--or);
    }

    #gBtn {
      position: absolute; left: 62px; top: 535px; width: 489px; height: 59.5px;
      border: 1.5px solid var(--gBorder); border-radius: 999px; background: rgba(255,255,255,.92);
      box-shadow: 0 1px 2px rgba(0,0,0,.03); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: var(--g-gap);
      font-size: var(--gt-fs); font-weight: var(--gt-fw); letter-spacing: var(--gt-ls); color: var(--gtext);
      transition: background .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.2,.7,.3,1);
    }
    #gBtn:hover { background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.07); }
    #gBtn:active { transform: translateY(1px); }

    #bottom {
      position: absolute; left: 62px; width: 489px; top: var(--bt-top); text-align: center;
      font-size: var(--bt-fs); font-weight: var(--bt-fw); letter-spacing: var(--bt-ls); color: var(--bottom);
    }
    #bottom a {
      color: #000; font-weight: 700; text-decoration: underline;
      text-underline-offset: 3px; text-decoration-thickness: 2px;
    }

    :focus-visible { outline: 2px solid #2b6cb0; outline-offset: 2px; }

    /* Entry Animation Guard */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0; will-change: transform, opacity, clip-path;
    }

    .entry-pending .card { transform: translateY(12px) scale(.988); }
    .entry-pending .badge { transform: translateY(8px); }
    .entry-pending #hl1, .entry-pending #hl2 { transform: translateY(16px); clip-path: inset(100% 0 0 0); }
    .entry-pending #h1, .entry-pending #sub { transform: translateY(10px); }
    .entry-pending #email, .entry-pending #pw, .entry-pending #loginBtn,
    .entry-pending .divider, .entry-pending #gBtn, .entry-pending #bottom { transform: translateY(8px); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .entry-pending .card, .entry-pending .badge, .entry-pending #hl1, .entry-pending #hl2,
      .entry-pending #h1, .entry-pending #sub, .entry-pending #email, .entry-pending #pw,
      .entry-pending #loginBtn, .entry-pending .divider, .entry-pending #gBtn, .entry-pending #bottom {
        opacity: 1 !important; transform: none !important; clip-path: none !important; will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="photo">
      <video class="photo-img photo-img--tall" autoplay muted loop playsinline preload="auto">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">
      </video>
      <video class="photo-img photo-img--wide" aria-hidden="true" autoplay muted loop playsinline preload="auto">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">
      </video>
      <div class="scrim"></div>
      <div class="hero" id="hero">
        <div class="badge">
          <svg viewBox="0 0 582 557" width="17" height="16.27" fill="#fff" style="margin-top:-1px">
            <path fill-rule="evenodd" d="M449.0 0.0 435.0 0.0 415.0 10.0 200.0 249.0 187.0 276.0 189.0 299.0 212.0 326.0 232.0 332.0 289.0 334.0 289.0 516.0 301.0 543.0 324.0 346.0 556.0 374.0 536.0 573.0 311.0 582.0 288.0 579.0 264.0 559.0 240.0 539.0 233.0 478.0 230.0 478.0 32.0 470.0 13.0ZM442.0 38.0 446.0 250.0 466.0 267.0 540.0 270.0 547.0 285.0 341.0 520.0 332.0 522.0 324.0 514.0 321.0 314.0 307.0 300.0 295.0 297.0 233.0 297.0 224.0 291.0 221.0 282.0ZM1.0 67.0 4.0 81.0 17.0 90.0 216.0 90.0 223.0 87.0 232.0 74.0 228.0 57.0 215.0 49.0 18.0 49.0 5.0 57.0ZM0.0 285.0 4.0 300.0 17.0 308.0 105.0 308.0 118.0 299.0 121.0 291.0 119.0 278.0 111.0 270.0 103.0 267.0 17.0 267.0 4.0 275.0ZM1.0 495.0 4.0 511.0 10.0 517.0 23.0 520.0 179.0 520.0 191.0 516.0 200.0 500.0 196.0 488.0 182.0 479.0 18.0 479.0 9.0 483.0"/>
          </svg>
          <span id="badgeTxt" style="text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">Built for fast-moving teams</span>
        </div>
        <div class="hl-wrap">
          <span class="hl" id="hl1" style="text-transform: uppercase; font-weight: 800;">FIND SIGNAL TO ACTION</span>
          <span class="hl" id="hl2" style="text-transform: uppercase; font-weight: 800;">INSTANTLY</span>
        </div>
      </div>
    </section>
    <section class="pane">
      <div class="card" id="card">
        <div class="card-in" id="cardIn">
          <h1 class="col center" id="h1" style="text-transform: uppercase; font-weight: 800;">CREATE ACCOUNT</h1>
          <p class="col center" id="sub" style="text-transform: uppercase; font-weight: 600;"><b>START FREE</b> TO CONTINUOUSLY MONITOR YOUR SIGNALS.</p>
          <div class="field" id="email">
            <input type="email" id="emailInput" name="email" autocomplete="email" aria-label="Email address" placeholder="Eg. johndoe@gmail.com" />
          </div>
          <div class="field" id="pw" style="display: flex; align-items: center; padding-right: 12px;">
            <input type="password" id="pwInput" name="password" autocomplete="new-password" aria-label="Password" placeholder="Create Password" style="flex: 1;" />
            <button type="button" id="togglePw" style="background: none; border: none; cursor: pointer; padding: 4px; color: #606060; font-size: 16px;" aria-label="Toggle password visibility">👁️</button>
          </div>
          <button type="button" id="loginBtn" style="text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em;">
            <span>CREATE ACCOUNT</span>
            <svg width="13.2" height="13.2" viewBox="0 0 22 22">
              <path d="M3 11h15.4M11 3.3l7.7 7.7-7.7 7.7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <p id="bottom" style="top:468px; text-transform: uppercase; font-weight: 600;">ALREADY HAVE AN ACCOUNT? <a href="login.html" style="font-weight: 800;">LOG IN</a></p>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var togglePw = document.getElementById('togglePw');
      var pwInput = document.getElementById('pwInput');
      if (togglePw && pwInput) {
        togglePw.addEventListener('click', function () {
          if (pwInput.type === 'password') {
            pwInput.type = 'text';
            togglePw.textContent = '🙈';
          } else {
            pwInput.type = 'password';
            togglePw.textContent = '👁️';
          }
        });
      }

      var REF_W=1464, REF_H=949, PHOTO_W=836, PANE_W=628, CARD_W=613, CARD_H=922;
      var CONTENT_H=697;
      var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
      var PANE_RATIO=PANE_W/REF_W;
      var HERO_W=681, HERO_H=219;
      var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;

      var card = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var hero = document.getElementById('hero');
      var pane = document.querySelector('.pane');
      var photo = document.querySelector('.photo');

      function clearInline() {
        if (photo) photo.style.cssText = '';
        if (pane) pane.style.cssText = '';
        if (card) card.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (hero) hero.style.cssText = '';
      }

      function photoRatio(vw) {
        if (vw >= RAMP_HI) return 1 - PANE_RATIO;
        if (vw >= RAMP_LO) return PHOTO_MIN + (vw - RAMP_LO)/(RAMP_HI - RAMP_LO) * ((1 - PANE_RATIO) - PHOTO_MIN);
        return PHOTO_MIN;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        clearInline();

        if (vw >= 700) {
          var pr = photoRatio(vw);
          var pw = Math.round(vw * pr);
          var paneW = vw - pw;

          if (photo) photo.style.width = pw + 'px';
          if (pane) {
            pane.style.left = pw + 'px';
            pane.style.width = paneW + 'px';
          }

          var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
          var gapL = Math.round(1 * cs);
          var mT = Math.round(14 * cs);
          var mB = Math.round(13 * cs);
          var mR = Math.round(14 * cs);
          var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
          var ch = vh - mT - mB;

          if (card) {
            card.style.left = gapL + 'px';
            card.style.top = mT + 'px';
            card.style.width = cw + 'px';
            card.style.height = ch + 'px';
            card.style.borderRadius = Math.round(26 * cs) + 'px';
          }

          if (cardIn) {
            cardIn.style.transform = 'translate(' + Math.round((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';
          }

          var imgScale = Math.max(pw / IMG_W, vh / IMG_H);
          var s = Math.min(imgScale / IMG_REF_SCALE, (pw * 0.92) / HERO_W);
          if (hero) {
            hero.style.transform = 'scale(' + s + ')';
            hero.style.transformOrigin = 'left bottom';
            hero.style.bottom = '0';
          }
        }
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    })();

    // WAAPI Ultra-Fast Entrance Animation
    (function () {
      function releaseEntrance() {
        document.documentElement.classList.remove('entry-pending');
        if (window.__entryFallback) clearTimeout(window.__entryFallback);
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) {
        releaseEntrance();
        return;
      }

      var ease = 'cubic-bezier(.1,1,.2,1)';
      var compact = window.matchMedia('(max-width:699px)').matches;

      var steps = [
        { el: '#card', delay: 0, duration: 250, easing: ease, from: { opacity: 0, transform: compact ? 'translateY(8px)' : 'translateY(6px) scale(.99)' }, to: { opacity: 1, transform: 'none' } },
        { el: '.badge', delay: 20, duration: 200, easing: ease, from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#hl1', delay: 40, duration: 220, easing: ease, from: { opacity: 0, transform: 'translateY(8px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#hl2', delay: 60, duration: 220, easing: ease, from: { opacity: 0, transform: 'translateY(8px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#h1', delay: 30, duration: 200, easing: ease, from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#sub', delay: 50, duration: 200, easing: ease, from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#email', delay: 70, duration: 180, easing: ease, from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#pw', delay: 90, duration: 180, easing: ease, from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#loginBtn', delay: 110, duration: 200, easing: ease, from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'none' } },
        { el: '#bottom', delay: 130, duration: 180, easing: ease, from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'none' } }
      ];

      requestAnimationFrame(function () {
        var anims = [];
        steps.forEach(function (s) {
          var element = document.querySelector(s.el);
          if (element) {
            var a = element.animate([s.from, s.to], {
              delay: s.delay,
              duration: s.duration,
              easing: s.easing,
              fill: 'both'
            });
            anims.push(a);
          }
        });
        releaseEntrance();
        Promise.allSettled(anims.map(function (a) { return a.finished; })).then(function () {
          anims.forEach(function (a) { a.cancel(); });
        });
      });
    })();
  </script>
</body>
</html>
